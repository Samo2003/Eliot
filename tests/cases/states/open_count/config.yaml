name: 1 packet to open let 3 pass and then close

build:
  root:
    id: Node
    initial: init
    transitions:
      INIT:
        action: 
          type: SetState
          target: Node
          state: open
        next:
          action: 
            type: Drop
      open:
        condition:
          type: Count
          after: 3
        if_false:
          action: 
            type: Finish
        if_true:
          action: 
            type: SetState
            target: Node
            state: close
          next:
            action: 
              type: Drop
      close:
        action:
          type: Drop

send:
  - count: 7