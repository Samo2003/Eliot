name: 1 packet to open let 3 pass and then close

build:
  root:
    id: Node
    initial: init
    transitions:
      INIT:
        next: 
          action: 
            actionType: ChangeState
            target: Node
            state: open
          next:
            action: 
              actionType: Drop
      open:
        next:
          condition:
            conditionType: Count
            after: 3
          if_false:
            action: 
              actionType: Finish
          if_true:
            action: 
              actionType: ChangeState
              target: Node
              state: close
            next:
              action: 
                actionType: Drop
      close:
        next:
          action:
            actionType: Drop

send:
  - count: 7