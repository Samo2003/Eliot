name: 1 packet to open let 3 pass and then close

build:
  root:
    id: NODE
    initial: INIT
    transitions:
      INIT:
        action: 
          type: SetState
          target: NODE
          state: OPEN
        next:
          action: 
            type: Drop
      OPEN:
        condition:
          type: Count
          after: 3
        if_false:
          action: 
            type: Finish
        if_true:
          action: 
            type: SetState
            target: NODE
            state: CLOSE
          next:
            action: 
              type: Drop
      CLOSE:
        action:
          type: Drop

send:
  - count: 7