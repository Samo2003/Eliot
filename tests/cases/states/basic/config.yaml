name: Basic StateNode Test

build:
  root:
    id: Node
    initial: init
    transitions:
      - state: INIT
        next: 
          action: 
            actionType: ChangeState
            target: Node
            state: end
          next:
            action: 
              actionType: Finish
      - state: end
        next:
          action: 
            actionType: Drop

send:
  - count: 5