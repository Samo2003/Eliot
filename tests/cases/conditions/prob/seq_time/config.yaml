name: Network time decay

build:
  defaultAction: Drop
  rules:
    - type: all
      conditions: 
        - conditionType: Prob
          seed: 123456
          x:
            generatorType: SeqTimeFloat
            min: 0.1
            max: 0.8
            step: 0.1
            period: 200
      actions:
        - actionType: Finish

timeout: 3

send:
  - count: 120
    interval: 50