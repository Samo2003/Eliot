name: Exponential generator every n

build:
  defaultAction: Finish
  rules:
    - type: all
      conditions: 
        - type: EveryN
          N: 
            type: Exponential
            min: 2
            max: 6
            mean: 4
            seed: 123456
      actions:
        - type: Drop

send: 
  - count: 100
  