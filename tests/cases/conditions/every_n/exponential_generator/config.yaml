name: Exponential generator every n

build:
  defaultAction: Finish
  rules:
    - type: all
      conditions: 
        - conditionType: EveryN
          N: 
            generatorType: ExponentialInt
            min: 2
            max: 6
            mean: 4
            seed: 123456
      actions:
        - actionType: Drop

send: 
  - count: 2000
  