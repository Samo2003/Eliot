name: Payload L4 offset

build:
  defaultAction: Drop
  rules:
    - type: all
      conditions:
        - conditionType: Payload
          pattern: aaaa
          end: 4
          l4: true
      actions:
        - actionType: Finish

send:
  - payload: 
      value: aaaa
  - payload: 
      value: aaaa
    src: ::1
  - protocol: udp
    payload: 
      value: aaaa
