name: Payload raw

build:
  defaultAction: Drop
  rules:
    - type: all
      conditions: 
        - type: Payload
          pattern: "b\x01\x05"
      actions:
        - type: Finish

send:
  - payload:
      value: "b\x01\x05"
  - payload:
      value: "b\x01\x05a"
  - payload:
      value: "b\x01\x06\x05"
