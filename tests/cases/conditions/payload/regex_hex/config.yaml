name: Payload regex binary

build:
  defaultAction: Drop
  rules:
    - type: all
      conditions:
        - conditionType: Payload
          pattern: "\xAA\xBB.*\xCC"
          type: regex
      actions:
        - actionType: Finish

send:
  - payload:
      value: aabbcc
      encoding: hex
  - payload:
      value: aabb00cc
      encoding: hex
  - payload:
      value: aacc
      encoding: hex
  - payload:
      value: bbcc
      encoding: hex
