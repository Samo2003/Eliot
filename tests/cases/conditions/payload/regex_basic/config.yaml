name: Payload regex basic

build:
  defaultAction: Drop
  rules:
    - type: all
      conditions:
        - type: Payload
          pattern: GET.*HTTP
          pattern_type: regex
      actions:
        - type: Finish

send:
  - payload: 
      value: "GET /index.html HTTP/1.1"
      encoding: ascii
  - payload:
      value: "GET HTTP"
      encoding: ascii
  - payload:
      value: "POST /index HTTP/1.1"
      encoding: ascii
  - payload:
      value: "GET /something"
      encoding: ascii
  - payload:
      value: "random data"
      encoding: ascii
