name: Payload negative end

build:
  defaultAction: Drop
  rules:
    - type: all
      conditions:
        - conditionType: Payload
          pattern: aaaa
          end: -6   # +4 for seq number in payload
      actions:
        - actionType: Finish

send:
  - payload:
      value: aaaaXX
  - payload:
      value: aaaa
  - payload:
      value: xxaaaa