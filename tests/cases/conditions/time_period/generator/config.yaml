name: TimePeriod generator test

build:
  defaultAction: Drop
  rules:
    - type: all
      conditions:
        - type: TimePeriod
          t:
            type: SeqCount
            min: 100
            step: 100
          f: 100
      actions:
        - type: Finish

send:
  - count: 1
  - delay: 150
  - count: 1
  - delay: 100
  - count: 1
  - delay: 200
  - count: 1
  - delay: 100
  - count: 1
  - delay: 300
  - count: 1