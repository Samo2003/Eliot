name: IP dst

build:
  defaultAction: Finish
  rules:
    - type: all
      conditions: 
        - type: IP
          dst: 127.0.0.1
      actions:
        - type: Drop

send: 
  - src: 127.0.0.1
  - count: 1
  - protocol: tcp
  - src: 10.0.0.1
  - dst: ::1
  - src: ::1
  - dst: 127.0.0.1
  - dst: 127.0.0.1
    src: 127.0.0.1
  