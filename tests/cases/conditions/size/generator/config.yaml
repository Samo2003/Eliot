name: Size generator  test

build:
  defaultAction: Drop
  rules:
    - type: all
      conditions: 
        - type: Size
          size:
            type: UniformInt
            min: 30
            max: 40
          op: gt
      actions:
        - type: Finish

send:       # All packet sizes are +20 for IPv4 header
  - payload_size: 25
    count: 500
  - payload_size: 5
    count: 500
