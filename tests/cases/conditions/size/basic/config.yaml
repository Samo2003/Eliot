name: Basic size test

build:
  defaultAction: Drop
  rules:
    - type: all
      conditions: 
        - type: Size
          size: 40
          op: gt
      actions:
        - type: Finish

send:       # All packet sizes are +20 for IPv4 header
  - payload_size: 21
  - payload_size: 20
  - payload_size: 19
