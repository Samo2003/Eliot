name: Line controlling with special control packets DELAY, ACTIVE, DROP

build:
  root:
    condition:
      type: Payload
      pattern: DELAY
      pattern_type: ascii
      l4: true
    if_true:
      action:
        type: SetState
        target: control                       # State node reference
        state: DELAY
      next:
        action:
          type: Drop
    if_false:
      condition:
        type: Payload
        pattern: ACTIVE
        pattern_type: ascii
        l4: true
      if_true:
        action:
          type: SetState
          target: control                     # State node reference
          state: ACTIVE
        next:
          action:
            type: Drop
      if_false:
        condition:
          type: Payload
          pattern: DROP
          pattern_type: ascii
          l4: true
        if_true:
          action:
            type: SetState
            target: control                   # State node reference
            state: DROP
          next:
            action:
              type: Drop
        if_false:
          id: control                         # State node identifier
          initial: ACTIVE
          transitions:
            ACTIVE:
              action:
                type: Finish
            
            DELAY:
              action:
                type: Delay
                n:
                  type: NormalInt
                  m: 200
                  s: 25
                  seed: 123456
              next:
                action:
                  type: Finish
            
            DROP:
              action:
                type: Drop

timeout: 2

send:
  - count: 10
  - payload:
      value: ACTIVE
      encoding: ascii
  - count: 10
  - payload:
      value: DROP
      encoding: ascii
  - count: 10
  - payload:
      value: ACTIVE
      encoding: ascii
  - count: 10
  - payload:
      value: DELAY
      encoding: ascii
  - count: 10  
