name: Duplicates all UDP packets

build:
  root:
    condition:
      type: Protocol
      id: 17    # UDP
    if_true:
      action:
        type: Replicate
        n: 1
      next:
        action:
          type: Finish
    if_false:
      action:
        type: Finish

send:
  - protocol_id: 17   # UDP
    count: 5
  - protocol_id: 6    # TCP
    count: 5
