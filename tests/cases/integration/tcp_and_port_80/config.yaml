name: Drops all TCP packets to or from port 80

build:
  root:
    condition:
      type: Protocol
      id: 6             # TCP protocol number
    if_true:
      condition:
        type: Port
        port: 80
      if_true:
        action:
          type: Drop
      if_false:
        action:
          type: Finish
    if_false:
      action:
        type: Finish

send:
  - protocol: tcp
  - protocol: udp
    sport: 80
  - protocol: udp
    dport: 80
  - protocol: tcp
    sport: 80 
  - protocol: tcp
    dport: 80
  
