name: 2 FSM for 2 drones differentiated by IP

build:
  root:
    condition:
      type: IP
      dst: 10.10.10.10
    if_true:
      id: drone1
      initial: INIT
      transitions:
        INIT:
          condition:
            type: Payload
            pattern: UP
            pattern_type: ascii
            l4: true
          if_true:
            action:
              type: SetState
              target: drone1
              state: UP
            next:
              action:
                type: Finish
          if_false:
            action:
              type: Finish

        UP:
          condition:
            type: Payload
            pattern: DOWN
            pattern_type: ascii
            l4: true
          if_true:
            condition:
              type: EveryN
              N: 3
            if_true:
              action:
                type: SetState
                target: drone1
                state: DOWN
              next:
                action:
                  type: Finish
            if_false:
              action:
                type: Drop
          if_false:
            action:
              type: Finish
          
        DOWN:
          condition:
            type: Payload
            pattern: DOWN
            pattern_type: ascii
            l4: true
          if_true:
            action:
              type: SetState
              target: drone1
              state: UP
            next:
              action:
                type: Finish
          if_false:
            action:
              type: Finish

    if_false:
      condition:
        type: IP
        dst: 10.10.10.20
      if_true:
        id: drone2
        initial: INIT
        transitions:
          INIT:
            condition:
              type: Payload
              pattern: UP
              pattern_type: ascii
              l4: true
            if_true:
              action:
                type: SetState
                target: drone2
                state: UP
              next:
                action:
                  type: Finish
            if_false:
              action:
                type: Finish

          UP:
            condition:
              type: Payload
              pattern: DOWN
              pattern_type: ascii
              l4: true
            if_true:
              condition:
                type: EveryN
                N: 3
              if_true:
                action:
                  type: SetState
                  target: drone2
                  state: DOWN
                next:
                  action:
                    type: Finish
              if_false:
                action:
                  type: Drop
            if_false:
              action:
                type: Finish
            
          DOWN:
            condition:
              type: Payload
              pattern: DOWN
              pattern_type: ascii
              l4: true
            if_true:
              action:
                type: SetState
                target: drone2
                state: UP
              next:
                action:
                  type: Finish
            if_false:
              action:
                type: Finish

      if_false:
        action:
          type: Finish

send:
  - dst: 10.10.10.10      # drone 1 state -> UP
    payload: 
      value: UP
      encoding: ascii
  - dst: 10.10.10.10      # drone 1 state -> DOWN
    payload: 
      value: DOWN
      encoding: ascii
    count: 3
  - dst: 10.10.10.20      # drone 2 state -> UP
    payload: 
      value: UP
      encoding: ascii
  - count: 1              # Random packet should be accepted
  - dst: 10.10.10.10      # drone 1 state -> UP
    payload: 
      value: UP
      encoding: ascii
  - dst: 10.10.10.10      # drone 1 state -> UP still
    payload: 
      value: DOWN
      encoding: ascii
  - count: 1              # Random packet should be accepted
  - dst: 10.10.10.20      # drone 2 state -> DOWN
    payload: 
      value: DOWN
      encoding: ascii
    count: 3
