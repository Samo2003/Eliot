name: 2 FSM for 2 drones differentiated by IP

build:
  root:
    condition:
      conditionType: IP
      dst: 10.10.10.10
    if_true:
      id: drone1
      initial: INIT
      transitions:
        INIT:
          next:
            condition:
              conditionType: Payload
              pattern: UP
              encoding: ascii
              l4: true
            if_true:
              action:
                actionType: ChangeState
                target: drone1
                state: UP
              next:
                action:
                  actionType: Finish
            if_false:
              action:
                actionType: Finish

        UP:
          next:
            condition:
              conditionType: Payload
              pattern: DOWN
              encoding: ascii
              l4: true
            if_true:
              condition:
                conditionType: EveryN
                N: 3
              if_true:
                action:
                  actionType: ChangeState
                  target: drone1
                  state: DOWN
                next:
                  action:
                    actionType: Finish
              if_false:
                action:
                  actionType: Drop
            if_false:
              action:
                actionType: Finish
          
        DOWN:
          next:
            condition:
              conditionType: Payload
              pattern: DOWN
              encoding: ascii
              l4: true
            if_true:
              action:
                actionType: ChangeState
                target: drone1
                state: UP
              next:
                action:
                  actionType: Finish
            if_false:
              action:
                actionType: Finish
    if_false:
      condition:
        conditionType: IP
        dst: 10.10.10.20
      if_true:
        id: drone2
        initial: INIT
        transitions:
          INIT:
            next:
              condition:
                conditionType: Payload
                pattern: UP
                encoding: ascii
                l4: true
              if_true:
                action:
                  actionType: ChangeState
                  target: drone2
                  state: UP
                next:
                  action:
                    actionType: Finish
              if_false:
                action:
                  actionType: Finish

          UP:
            next:
              condition:
                conditionType: Payload
                pattern: DOWN
                encoding: ascii
                l4: true
              if_true:
                condition:
                  conditionType: EveryN
                  N: 3
                if_true:
                  action:
                    actionType: ChangeState
                    target: drone2
                    state: DOWN
                  next:
                    action:
                      actionType: Finish
                if_false:
                  action:
                    actionType: Drop
              if_false:
                action:
                  actionType: Finish
            
          DOWN:
            next:
              condition:
                conditionType: Payload
                pattern: DOWN
                encoding: ascii
                l4: true
              if_true:
                action:
                  actionType: ChangeState
                  target: drone2
                  state: UP
                next:
                  action:
                    actionType: Finish
              if_false:
                action:
                  actionType: Finish
      if_false:
        action:
          actionType: Finish

send:
  - dst: 10.10.10.10      # drone 1 state -> UP
    payload: 
      value: UP
      encoding: ascii
  - dst: 10.10.10.10      # drone 1 state -> DOWN
    payload: 
      value: DOWN
      encoding: ascii
    count: 3
  - dst: 10.10.10.20      # drone 2 state -> UP
    payload: 
      value: UP
      encoding: ascii
  - count: 1              # Random packet should be accepted
  - dst: 10.10.10.10      # drone 1 state -> UP
    payload: 
      value: UP
      encoding: ascii
  - dst: 10.10.10.10      # drone 1 state -> UP still
    payload: 
      value: DOWN
      encoding: ascii
  - count: 1              # Random packet should be accepted
  - dst: 10.10.10.20      # drone 2 state -> DOWN
    payload: 
      value: DOWN
      encoding: ascii
    count: 3
