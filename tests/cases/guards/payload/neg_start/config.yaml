name: Payload negative start

build:
  defaultAction: Drop
  rules:
    - type: all
      conditions:
        - conditionType: Payload
          pattern: aaaa
          start: -8   # +4 for seq number in payload
      actions:
        - actionType: Finish

send:
  - payload:
      value: xxaaaa
  - payload:
      value: aaaa
  - payload:
      value: aaaaxx
