name: Time duration test

build:
  defaultAction: Drop
  rules:
    - type: all
      guards:
        - guardType: Time
          after: 100
          duration: 300
      actions:
        - actionType: Finish

send:
  - count: 1
  - delay: 150
  - count: 1
  - delay: 50
  - count: 1
  - delay: 200
  - count: 50
