name: Basic port condition test

build:
  defaultAction: Drop
  rules:
    - type: all
      conditions: 
        - conditionType: Port
          port: 5555
      actions:
        - actionType: Finish

send:
  - sport: 5555
    protocol: tcp
  - dport: 5555
    protocol: udp
  - sport: 5555
    dport: 5555
    protocol: tcp
  - sport: 21179
    protocol: udp
  - count: 1
  - payload_size: 3 