# Drops all TCP packets with source or destination port 80
root:
  condition:
    type: Protocol
    id: 6     # TCP
  if_true:
    condition:
      type: Port
      port: 80
    if_true:
      action: { type: Drop }
    if_false:
      action: { type: Finish }
  if_false:
    action: { type: Finish }
