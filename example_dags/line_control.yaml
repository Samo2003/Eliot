# Control FSM for dynamic packet handling.
#
# Special payload commands ("DELAY", "ACTIVE", "DROP") change the internal
# state of the system. After a state change command is received, the packet
# is dropped to prevent forwarding control messages.
#
# States:
# - ACTIVE: packets are forwarded normally.
# - DELAY: packets are delayed using a normally distributed delay.
# - DROP: packets are discarded.
#
# If no control command is detected, packet processing follows
# the behavior of the current state.

root:
  condition:
    type: Payload
    pattern: DELAY
    pattern_type: ascii
    l4: true
  if_true:
    action:
      type: SetState
      target: control                       # State node reference
      state: DELAY
    next:
      action:
        type: Drop
  if_false:
    condition:
      type: Payload
      pattern: ACTIVE
      pattern_type: ascii
      l4: true
    if_true:
      action:
        type: SetState
        target: control                     # State node reference
        state: ACTIVE
      next:
        action:
          type: Drop
    if_false:
      condition:
        type: Payload
        pattern: DROP
        pattern_type: ascii
        l4: true
      if_true:
        action:
          type: SetState
          target: control                   # State node reference
          state: DROP
        next:
          action:
            type: Drop
      if_false:
        id: control                         # State node identifier
        initial: ACTIVE
        transitions:
          ACTIVE:
            action:
              type: Finish
          
          DELAY:
            action:
              type: Delay
              n:
                type: NormalInt
                m: 200
                s: 25
            next:
              action:
                type: Finish
          
          DROP:
            action:
              type: Drop
