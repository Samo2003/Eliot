# Drops all TCP packets with source or destination port 80
root:
  condition:
    conditionType: Protocol
    id: 6     # TCP protocol number
  if_true:
    condition:
      conditionType: Port
      port: 80
    if_true:
      action:
        actionType: Drop
    if_false:
      action:
        actionType: Finish
  if_false:
    action:
      actionType: Finish
