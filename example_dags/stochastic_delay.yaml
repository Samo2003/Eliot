# Delays all incoming packets with a random delay and then stochastically drop packets
root:
  action:
    type: Delay
    n: 
      type: NormalInt
      m: 100
      s: 30
      min: 1
  next:
    condition:
      type: Prob
      x:
        type: NormalFloat
        m: 0.5
        s: 0.2
    if_true:
      action:
        type: Finish
    if_false:
      action:
        type: Drop
