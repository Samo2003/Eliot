# RNG benchmark DAG with probabilistic branching
root:
  condition:
    type: Prob
    x:
      type: UniformFloat
      min: 0
      max: 1
  if_true:
    condition:
      type: Prob
      x:
        type: NormalFloat
        m: 0.5
        s: 0.2
    if_true:
      action:
        type: Finish
    if_false:
      action:
        type: Drop
  
  if_false:
    condition:
      type: Prob
      x:
        type: NormalFloat
        m: 0.3
        s: 0.1
    if_true:
      action:
        type: Finish
    if_false:
      action:
        type: Drop
